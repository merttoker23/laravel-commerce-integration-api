openapi: 3.0.3
info:
  title: Laravel Commerce Integration API
  version: 1.0.0
  description: Sanitized API contract for catalog, order and integration workflows.
servers:
  - url: http://localhost:8080/api
paths:
  /products:
    get:
      summary: List products
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: active
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated product result
          content:
            application/json:
              schema:
                type: object
  /products/{sku}:
    get:
      summary: Retrieve a product by SKU
      parameters:
        - in: path
          name: sku
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: Validation or stock error
  /integrations/suppliers/demo/sync:
    post:
      summary: Synchronize products from the demo supplier
      responses:
        '200':
          description: Synchronization completed
          content:
            application/json:
              schema:
                type: object
  /webhooks/payment/demo:
    post:
      summary: Accept a demo payment event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted
  /webhooks/cargo/demo:
    post:
      summary: Accept a demo cargo event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted
components:
  schemas:
    Product:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        price:
          type: string
          example: '49.90'
        currency:
          type: string
          example: EUR
        stock_quantity:
          type: integer
        is_active:
          type: boolean
    CreateOrderRequest:
      type: object
      required:
        - customer
        - items
      properties:
        customer:
          type: object
          required:
            - name
            - email
          properties:
            name:
              type: string
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 190
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - sku
              - quantity
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1
        shipping_address:
          type: object
          additionalProperties: true
    Order:
      type: object
      properties:
        order_number:
          type: string
        status:
          type: string
        subtotal:
          type: string
        currency:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              quantity:
                type: integer
              unit_price:
                type: string
              line_total:
                type: string
